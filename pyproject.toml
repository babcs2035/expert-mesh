[project]
name = "encounter-expert-mesh"
version = "0.1.0"
description = "Encounter-based Expert Mesh Phase 0: Distributed routing implementation for always-on wired LAN with HTTP POST protocol"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
# Only needed to fit a new embedding_postprocess=whiten artifact
# (scripts/fit_embedding_whitening.py); the serving path (router.py) applies
# the precomputed transform with plain Python, so nodes never need this.
research = ["numpy>=1.26"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
