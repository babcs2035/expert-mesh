[project]
name = "encounter-expert-mesh"
version = "0.1.0"
description = "Encounter-based Expert Mesh Phase 0: Distributed routing implementation for always-on wired LAN with HTTP POST protocol"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "scipy>=1.18",
    "einops[research]>=0.8.2",
]

[project.optional-dependencies]
# Only needed to fit a new embedding_postprocess=whiten artifact
# (scripts/fit_embedding_whitening.py); the serving path (router.py) applies
# the precomputed transform with plain Python, so nodes never need this.
research = [
    "numpy>=1.26",
    "peft>=0.12",
    "setfit>=1.1",
    "sentence-transformers>=3.0",
]
# E10: LoRA training dependencies for scripts/train_domain_lora.py.
# Not installed by default to keep the serving image small and avoid
# pulling torch/transformers on nodes that only run inference.
# Install with: uv sync --extra lora
lora = [
    "torch>=2.4",
    "transformers>=4.45",
    "peft>=0.12",
    "bitsandbytes>=0.44",
    "datasets>=2.20",
    "accelerate>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
