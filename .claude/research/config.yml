            機序を踏まえ，**全ドメイン同時に同一の抽出・重み付けルールを適用する**ことで
            この結合バグの影響を回避する（1 ドメインだけ動かす設計は再度同型の失敗を招くため
            禁止）．
            **具体的な手法（tavily-search で確認した定石）**: hard negative mining
            （分類器が誤りやすい行＝他ドメインとの境界に近い行を優先的に訓練データへ追加する）．
            `models/domain_classifier.joblib` の現行分類器で `data/classifier_train.jsonl`
            全 1427 件の予測確信度を計算し，正解クラスの確率が低い（＝hard な）行を
            各ドメイン同数ずつ追加抽出する．
            **成功条件**: 次回の計画フェーズで具体化する（education だけを狙い撃ちにした過去の
            resampling 系（Iter32〜34，rejected）とは異なり，全ドメイン均等の抽出のため，
            education_recall 単体ではなく top1_accuracy 全体を主基準とすること）．
            **単一レバー原則との関係**: 抽出ルールを 1 つ決めたら，全ドメインへ同一パラメータ
            （追加件数・閾値）で適用し，ドメインごとにパラメータを変えない．"}

