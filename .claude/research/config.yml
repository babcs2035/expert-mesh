            **SetFit**（HuggingFace 2023）はSentence Transformersのfew-shot fine-tuning。
            contrastive learningにより少量のラベル付きデータ（education 150件）で
            埋め込み空間を再調整可能。
            **先行研究**: SDJC（Chen et al. 2025）は日本語ドメイン適応でJACSTS rho=0.84達成。
            JCSE（Chen et al. 2023）もEduドメインでSTS rho=0.8243達成。
            **実施方法**: `sentence-transformers` + `setfit` パッケージのインストール +
            `SetFitTrainer` によるcontrastive fine-tuning。
            **訓練データ**: 既存の `data/classifier_train.jsonl` のeducation行（150件）を
            使用。positive pairはeducation行同士、negative pairは他ドメイン行からサンプリング。
