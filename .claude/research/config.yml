# 2. dispatch_policy=adaptive_confidence_gap（下記既存レバー）：research_frontier の複合ドメイン
#    課題に直接効くが，config.yaml のスキーマ変更を伴うため着手前に改めてユーザー確認を要する．
#    1. の結果を見てから着手すること．
# 3. routing_confidence_calibration_method の再実験（下記既存レバーに
