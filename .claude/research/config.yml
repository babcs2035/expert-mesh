            **本レバーの仮説**: 集合サイズが劣った機序は『conformal であること』ではなく
            『1〜8 の 8 段階という解像度の粗さ』（size<=4 と size<=5 の間で coverage が
            0.5425→0.8013 へ飛び中間の運用点が無い．同点を max_probability で解くと
            AUGRC が 0.145975 へ改善する）．そこで既存特徴（max_probability / margin /
            negative_entropy / conformal set_size / 上位確率の形状）を**校正半 800 行だけで
            学習した post-hoc スコア器**（ロジスティック回帰等の低容量モデル．目的変数は
            `argmax in expected_domains` の誤り）で連続値へ束ね，基準線を上回るかを測る．
            **単一レバー**: 棄権スコアの生成方法を `max_probability`（基準線）→
            `learned_deferral_head` へ変更する 1 点のみ．入力 jsonl・正誤定義・split・
            分類器・埋め込み・実行時経路はすべて Iter76 と同一に固定する．
            **レバーを読むコード行と到達条件**: `scripts/evaluate_selective_routing.py` の
            スコア関数テーブル `_SIGNALS` へ 1 エントリ追加し，`--abstention-signal
            learned_deferral_head` で引く 1 箇所．到達条件は CLI 実行そのもの．
            **必須の設計上の縛り（これを破ると測っているものが変わる）**: 学習は
            `split == 'calibration'` の 800 行のみで行い，評価は `split == 'eval'` の 800 行で
            行う（in-sample 評価は禁止．Iter76 の基準線 0.138450 と同一の 800 行上で比較する）．
            **成功条件**: 主基準は eval 半 n=800 の AUGRC で learned_deferral_head <
            max_probability かつ対応ありブートストラップ（B=10,000, seed 42）の ΔAUGRC 95%CI が
            0 を跨がないこと．**Iter76 の教訓により符号まで事前登録すること**（CI が 0 を
            跨がないだけでは合格条件にならない）．検出力は ΔAUGRC の SE≈0.0037 から
            0.008 程度以上の効果なら検出できる．非退行は rank_1（argmax）不変＝定義上不変
            （eval top1=0.605000 / 全体 0.597500 / argmax 一致 800/800・1,600/1,600）と，
            coverage=1.0 の誤り率 0.3950 が全信号で一致すること．
            **必ず事前シミュレーションで着地点を数値化してから本実行する**（Iter71 以降の慣行）．
