            `predict_proba` 出力）に対し，held-out キャリブレーションセットで non-conformity score
            を計算し，予測集合（prediction set）を構成する．**分類器の再訓練は不要**，既存 confidence
            値の再利用でオフライン完結する．
            **単一レバー原則との相性**: 良い．argmax（1 位選択）自体は変えず，予測集合のサイズや
            fallback 判定にのみ影響する後付けの統計的処理として実装できる．
