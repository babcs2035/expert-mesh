# research-cycle 設定: expert-mesh
# サイクル全体の手順はグローバル skill（~/.claude/skills/research-cycle/SKILL.md）が規定する．
# ここにはこのリポジトリ固有の差分だけを書く．

repo_name: expert-mesh

# 実験の起動系（実機 3 ノード: wafl500/general(依頼者兼任)・wafl502/legal・wafl503/medical，
# Docker + ローカル registry(5001番，WAFL-PEFTの5000番と衝突回避)，mise タスク）
# 2026-07-20 ユーザー通達: 192.168.15.100〜109（最大10台，同一スペック）が実機として利用可能．
# VRAMは常に確保（コンテナ常時起動．docker-compose.ymlにOLLAMA_KEEP_ALIVE=-1設定済み，commit 94d4b50）．
# ノード拡張の活用方向はユーザー承認済み（新規専門ドメインの追加，research_frontier参照）．
# Iteration 2（routing_method）は単一レバー原則を守るため現行3ノード構成のまま実施し，
# ノード拡張は別イテレーションとして着手する．
# 【2026-09-19 ユーザー指示（恒久的な運用ルール）】本体の実験（実機ノード wafl500〜509 を
# 使った実際のルーティング1600問本走）以外の処理（合成データ生成のLLM呼び出し，埋め込み計算，
# judge_model呼び出し等）は，実験ドメインノード（wafl500〜509）ではなく専用の制御ホスト
# wafl-ctrl5（Hostname 192.168.15.10，User denjo，ProxyJump wafl 経由，~/.ssh/config 定義済み，
# GPU: NVIDIA GeForce RTX 3060 12GB）を使うこと．Iter64 でこの方針に合わせて wafl-ctrl5 上に
# Ollama（Docker，`ollama/ollama:latest`イメージ，`--runtime nvidia`，他ノードと同じ
# docker-compose.gpu.ymlのGPU構成を踏襲）をセットアップ済み（詳細はjournal.md「Iteration 64
# 実行済み」節参照）．今後のイテレーションでも本体実験以外はwafl-ctrl5を優先すること．
tasks:
  setup:   "mise run setup"
  deploy:  "mise run deploy"
  run:     "mise run start"
  analyze: "mise run analyze"
  clean:   "mise run clean"        # 破壊的（--full はモデルデータも削除）．自動実行しない（backlog 経由で人間判断）

experiment:
  name_scheme: "Iter{n}"                          # results/<YYYYMMDD_HHMMSS>/ を Iter{n} に対応付けて journal に記録
  results_glob: "results/*/results.jsonl"
  # metrics.py は --results 必須のため，最新の実行結果を動的に解決してから渡す．
  metrics_cmd: "uv run python metrics.py --results $(ls -1dt results/*/ | head -1)results.jsonl --json"
  timeout_min: 150                 # 1600 問（Iter25 以降）の実測は 96-101 分（Iter27 の 3 実行）．余裕を見て 150 分
  poll_interval_sec: 120

# journal.md に残す直近イテレーション数．超過分は自動で journal_archive.md へ移す
# （reflector が rotate_journal.sh を呼ぶ）．journal.md の肥大化・毎フェーズの Read コストを抑えるため．
journal_retention: 3

# 単一レバー原則で振る候補（順序＝優先度）．1 イテレーションで動かすのは 1 つだけ．
#
# 2026-07-26 全面改訂（詳細と出典は plans/p0001_research_direction_2026-07.md）．
# Iter14 の converged 判定は撤回した．理由は，評価集合が 46 問しかなく，Iter3・Iter5〜11 の
# 「no-op / 僅差で棄却」という判定群が，実際には 1〜2 問の入れ替わり（p=0.87, n=46 で SE ±5.0pt，
# Wilson 95% CI 幅 約20pt）に基づいており，統計的に成立していなかったためである．
# したがって E1（評価集合の拡張）を最優先とした．
# **E1 は Iter15（1520 問）・Iter25（1600 問）で完了済み**であり，この前提はもう有効ではない
# （Iter14 以前の結果を一次情報として引用しないこと，という点だけが今も有効である）．
#
# 【2026-07-31 更新】**最初に docs/d0004_research_status_and_direction_2026-08.md を読むこと．**
# d0004 は Iter27 時点の現況・優先順位（Y1〜Y5）・反復している失敗モードとその恒久対策をまとめた
# 現況文書であり，次の一手はここから決める．
#
# **d0002_research_cycle_findings_2026-07.md と d0003_next_experiments_2026-07.md は
# 2026-07-29（Iter22 時点）で執筆されたまま更新されていない．**その後 Iter23〜27 が実施され，
# d0003 が「未実施」とする F1〜F5・X1・X2・X4・X6 の大半は完了している．
# **この 2 文書を単独の根拠として計画を立ててはならない**（現況の棚卸しは d0004 §2・§5）．
# 恒久的な手法上の知見は d0002 §5，文献的根拠は d0001 が引き続き有効．
#
# 【最重要の注意 — 同じ失敗を 6 回繰り返している】
# Iter16・20（E3），Iter21・22（E4），backlog B35（E7），Iter27（aggregation_method）は
# すべて「config を正しく変えて実験も完走したが，その設定を読むコードに実行が到達せず，
# 結果が基準線とビット単位で一致した」という同型の失敗である．のべ 10 時間以上の実機実行が
# これで失われた．**rc-planner は，レバーを選んだら計画フェーズで必ず『そのレバーを読むコード行と，
# そこへ到達する条件』を journal の計画節に明記すること．到達条件が現行構成で満たされないなら，
# そのレバーは実験対象にしない．**rc-experimenter は本走前に先頭 20 問程度で予備実行し，
# レバーが発火した証拠となるフィールドを直接確認すること．rc-analyst は主要指標が
# 基準線と完全一致した場合，「効果なし」ではなく「実験不成立」を既定の解釈とすること．
# 詳細は d0004 §4．
#
# 現在 config.yaml が指す構成（2026-07-31 時点，Iter28 完了後，HEAD=d87c006）:
#   confidence_signal_method=self_report, routing_method=supervised_classifier,
#   confidence_elicitation=top_k_with_probs（no-op，下記注記参照）,
#   expert_model=expert-mesh-{domain}-lora（10 ノード，Iter18 で採用），
#   light_model=qwen3.5:4b-q4_K_M，domain_count=10，
#   **confidence_threshold=0.0（Iter28 で採用．fallback 実質廃止），dispatch_top_k=1，
#   aggregation_method=max_confidence（top_k=1 では no-op）**．
#
# 基準線は results/20260731_162722/（Iter28，1600 問，fallback 廃止後）:
#   top1=0.585, kappa=0.554074, answer_quality=0.546667, fallback発生0/1600．
#   Iter25 基準線（results/20260730_145356/，fallback あり）:
#   top1=0.555625, single_domain_top1=0.569333, compound_top1=0.35,
#   compound_set_recall=0.165, kappa=0.521481, ECE=0.204021, fallback_rate=0.1325,
#   answer_quality=0.508667, end_to_end=0.328125, mean_duration_ms=3626.8
#
# レバーごとの状態（d0002 §3 のイテレーション別結果一覧が一次情報）:
# - E1（eval_set_size）: 採用．Iter15 で 1520 問，Iter25 で 1600 問（単一 1500 + 複合 100）へ拡張．
#   Wilson CI / McNemar / 3 ベースライン（Random 0.101 / BestSingle 0.109 / Oracle 1.0）を整備済み．再実装不要．
# - E2（stp_sign_check）: 棄却．オフライン検証済み，再実行不要．
# - E3（confidence_elicitation=top_k_with_probs）: **採用は取り下げ．supervised_classifier 下では
#   コードパスに到達しない no-op（http_server.py:_estimate_probe_confidence の分岐順序，d0002 §6-B）．
#   有効な測定は Iter16 の 1 回のみで McNemar p=0.0783（有意差なし）・ECE 悪化．D1 参照，判定保留中**．
# - E4（confidence_signal_method=self_consistency_semantic）: **「no-op」ではない．時系列に注意**．
#   Iter21 実行時点の HEAD では routing_method のチェックが confidence_signal_method より先に
#   return する分岐順序だったため，E4 を設定しても実際には E6（supervised_classifier）が動き続け，
#   E4 のコードパスは 1 度も実行されなかった（これが Iter21 の無効判定の理由．backlog B38）．
#   Iter22 でこの分岐順序を入れ替える修正が行われたが，デプロイ漏れで Iter22 自体はやはり旧分岐順序
#   のまま実行された（journal_archive.md の Iter22 節を参照）．**しかし Iter22 以降の HEAD には
#   この分岐順序修正が実際に反映されている**（当時の記述は `30e3627`．現 HEAD でも有効）．
#   したがって，**今後この状態から config.yaml で confidence_signal_method
#   を self_consistency_semantic に変更して実験すると，Iter21/22 とは異なり今度こそ実際に E4 の
#   コードパスが発火し，E6 の分類器分岐に到達できなくなる**（http_server.py:_estimate_probe_confidence
#   の分岐順序，d0002 §6-D）．**つまり E4 を単純に設定するだけの実験は，単一レバー原則に反して
#   E6 の効果を丸ごと消してしまう**．再設計が前提．docs/d0003 §5 X3 参照（X3-a: 分類器と2段構成に
#   する／X9 の較正を先に試すことを推奨）．
# - E5（p_true）: 未実施．Ollama v0.12.11+ の実機確認が前提（docs/d0003 X7）．**E4 と全く同じ分岐構造
#   の問題を持つ**：現在の HEAD で設定すると E6 の分類器分岐へ到達できなくなり，E6 が無効化される．
#   「no-op」ではなく「E6を上書きする」副作用である点に注意．
# - E6（routing_method=supervised_classifier）: **採用済み（Iter17）．top1_accuracy 0.2059→0.5651，
#   kappa 0.1067→0.5215．研究の主要な成果．data/dataset.jsonl と classifier_train.jsonl の質問本文
#   重複は 0 件確認済み（d0002 §6-E，label leakage なし）**．
# - E7（embedding_postprocess=whitening）: **実施不要．supervised_classifier 下で no-op（backlog B35）**．
# - E8（expert_model_size=qwen3.5-4b）: 棄却済み（Iter19）．mean_duration が 1.85 倍遅化，answer_quality 悪化．
# - E10（expert_specialization=domain_lora）: **採用済み（Iter18）．answer_quality 0.2787→0.5013．
#   ノード間の実能力差が生まれ，top1_accuracy が初めて下流に帰結を持つ指標になった**．
#
# 【次に着手すべき優先順位（2026-07-31 改訂．詳細は docs/d0004 §5）】
#   Y1（最優先・低コスト）: fallback 方策の廃止．**Iter28 で adopted・完了済み**（下記レバー参照）．
#   Y4（低コスト・オフライン，Y1 と並行可）: 分類器の較正（CalibratedClassifierCV，d0003 X9）．
#   **Iter31 で完了・adopted**．platt（Iter29，ECE絶対閾値未達でpartial）・isotonic（Iter30，
#   medical_recallのBH補正後有意悪化でpartial）に続き，temperature（Iter31）が
#   ECE≤0.150・top1_accuracy非退行（実際は有意改善 p=0.000906）・per-domain 20指標BH補正後
#   有意退行0件のAND条件を初めて満たしadopted．**本番反映済み**（`models/domain_classifier.joblib`
#   をtemperature版へ置き換え，較正前版は`models/domain_classifier_uncalibrated_pre_iter31.joblib`
#   として退避．sha256等の詳細はjournal.md「考察 (Iter31)」節参照．`models/`はgitignore対象の
#   ためこの置き換えはgit履歴に残らない点に注意）．
#   Y2（前提整備・要ユーザー確認）: confidence_threshold の二重責務の分離．
#   **`config.yaml`への`dispatch_candidate_threshold`新設・`select_dispatch_targets()`の
#   シグネチャ変更というスキーマ変更を伴うため，Y4完了後の現時点でも着手前にユーザー確認が
#   必要（backlog B49・B50・B51・B52で繰り返し申し送り，未解決）．rc-reflectorの自律判断権限
#   （可逆な判断に限る）では着手を開始できないため，Iter32はY2をスキップしYに進む**．
#   Y3: Y2 完了後に複合ドメイン評価（dispatch_top_k=2 + 集約方式）をやり直す．研究の問い③に答える唯一の実験
#   Y5: education/legal のデータ不均衡是正（d0003 X8）．**【2026-07-31 Iter31考察で選定・
#   backlog B52】Y4完了・Y2はユーザー確認待ちで自律着手不能のため，次イテレーション（Iter32）は
#   Y5を実施する**．**Iter31時点の実測で判明**: X8の成功条件（education/legalのrecallが
#   他ドメインの下限business_economics 0.4533を上回ること）のうち，legalは既に0.5833で
#   クリア済み（legalの訓練データ最少77件という懸念は，B50・B51で較正への影響としても既に
#   反証済み）．**残る唯一の未解決対象はeducationのみ**（recall 0.4059，全ドメイン中最下位，
#   Iter28基準線からIter29〜31まで一貫して変化なし＝較正では触れない領域の問題）．次点の
#   レバーは下記`classifier_training_data_composition`参照．
#   着手しない: X3（E4 再設計）・X7（E5 p_true）は E6 を無効化するため Y4 の結果を見てから判断．
#              E3 linguistic・E7 whitening は no-op 確定．E10 offtheshelf は実施不能．
#              hidden_state は Ollama で取得不可．無線アドホック化は Phase 3（スコープ外）．
#
# F1〜F5（測定系の修復）は Iter23 で完了済み（コミット 744728a/75441db/3840068/aa4a989）．
# X1（基準線再取得）は Iter23，X2（中央集権ルータ比較）は Iter26，X4（複合設問 100 問化）は Iter25 で完了．
# X6（回答品質のノイズ床の確定）は Iter27 の副産物として実質完了（下記 success_criteria に反映済み）．
#
# 【2026-09-18 ユーザー承認・converged からの再開方針（backlog B88 参照）】
# state.json は Iter56 完了時点で status="converged"（B87）だったが，全体レビューで下記 4 論点が
# 見つかり，ユーザー承認のうえ以下の優先順位で Iter57 以降に着手する．
# 1. 【最優先】production_deployment_gap（下記新規レバー，本節先頭）．
#    Iter52/53 で adopted 確定した education_per_class_threshold=0.05 が，実行時経路
#    classifier.py:estimate_confidence_classifier() には実装されておらず（実装は
#    scripts/evaluate_classifier_calibration.py 内のオフライン評価専用コードのみ），
#    「education_recall=0.6000 で天井・研究終了」（backlog B84）という結論の前提が実機で
#    未確認である．Iter55 の実機実測は 0.5118 で，0.6000 と一致しない．
# 2. dispatch_policy=adaptive_confidence_gap（下記既存レバー）：research_frontier の複合ドメイン
#    課題に直接効くが，config.yaml のスキーマ変更を伴うため着手前に改めてユーザー確認を要する．
#    1. の結果を見てから着手すること．
# 3. routing_confidence_calibration_method の再実験（下記既存レバーに
#    conformal_prediction_true_class_qhat を追加．q_hat を真クラススコア1,427件から再計算した
#    修正版）：優先度は低い．Iter56 のシミュレーションでも coverage=0.8025（target 0.87 未達）・
#    mean_set_size=7.31（target 超過）で，成功見込みは薄い．1・2 に手が無くなってから検討する．
# 4. 測定系の未解決課題（education_recall/medical_recall の母数不一致，McNemar chi2 の計算不一致，
#    answer_quality_accuracy の未計測が Iter29 以降常態化）は，単一レバー実験の対象ではなく検証・
#    修正タスクとして backlog B88 に記録済み．1〜3 のいずれかの実験と同時にオフラインで対応してよい．
levers:
  # --- 【2026-09-18 最優先・backlog B88】adopted 確定済みの変更が実行時経路に反映されているかの
  #     検証・修復．新規の手法検証ではなく，既存決定（Iter52/53）の実装漏れの是正 ---
  - {name: production_deployment_gap, values: [apply_education_threshold_to_runtime],
     note: "[2026-09-18 backlog B88] Iter52（threshold=0.02/0.05 両方 adopted）・Iter53
            （threshold=0.05 正式採用，education_recall=0.6000）の判定は
            scripts/evaluate_classifier_calibration.py の predict_calibrated_rows()
            （L238-241, L273-276: if education_threshold > 0.0: probabilities[edu_idx] +=
            education_threshold）で確認された．**しかしこの加算ロジックはオフライン評価スクリプト
            にしか存在せず，実行時経路 classifier.py:estimate_confidence_classifier()
            （L47-61）は CalibratedClassifierCV.predict_proba() の生値をそのまま返すだけで，
            threshold 加算を行わない．mise.toml にも該当パラメータの受け渡しは無い．**
            **帰結**: 「education_recall=0.6000 で post-hoc 手法の天井に達し研究終了」
            （backlog B84，2026-08-05 ユーザー承認）という最終結論の前提の一部が，実機の
            ルーティングでは成立していない．Iter55 の実機実測（education_recall=0.5118）は
            train_domain_classifier.py の intercept_delta=+0.7（Iter44，実行時に有効）のみを
            反映した値で，threshold=0.05 の効果を含んでいない．
            **実施方法**: (a) 検証: 現行実機構成（intercept_delta=+0.7 のみ）での
            education_recall を再確認し，Iter55 実測 0.5118 と一致するか確認する（オフラインで
            即座に検証可能，実機再走は不要）．(b) 実装: classifier.py の
            estimate_confidence_classifier() に，education ドメインの場合のみ
            evaluate_classifier_calibration.py と同じ加算ロジック（threshold=0.05，確率の
            再正規化は行わない．Iter51 で threshold=0.3 が失敗した理由は加算後に再正規化していた
            ためで，0.05 は再正規化なしで adopted されている点に注意）を追加する．(c) 検証:
            argmax flip rate <15%（既存成功条件のまま）を再確認．(d) 実機で 1600 問を 1 回実行し，
            education_recall が実際に medical_recall 基準（0.5112）を上回るかを最終確認する．
            **単一レバー原則との関係**: これは新しい手法ではなく，既に adopted 済みの変更を
            実行時経路へ反映する作業である．intercept_delta（訓練時，train_domain_classifier.py）
            は既に有効なため，今回変更するのは classifier.py の 1 箇所のみ．
            **成功条件**: (a) の再検証で 0.5118 との一致を確認できること．(d) の実機実測で
            education_recall > 0.5112（medical 基準）を再確認できること．非退行条件は既存の
            per_class_threshold 系実験と同一（他9ドメイン18指標のBH補正後有意退行0件，
            flip_rate<15%，top1_accuracy 非退行）．
            **これが不成立の場合**（例: 実機実測が 0.5112 を下回る）: backlog B84 の最終結論
            （研究 converged）を撤回し，「post-hoc 手法の天井」という結論自体を再検討する必要がある．"}

  # --- Y1: 最優先（歴史的）．既存データから効果が実測済みで，分散版での再現確認だけが残っている ---
  - {name: fallback_policy, values: [disabled],
     note: "[2026-07-31 d0004 §5 Y1 / backlog B48] 現行は confidence_threshold=0.5 未満のとき
            general ノードの light_model へ退避する（212/1600 = 13.25%）．
            **results/central_iter26/（閾値なし純 argmax ＝ fallback 廃止相当）と
            results/central_iter26b/（現行）はアーキテクチャ・分類器・データセットが同一で
            fallback 方策だけが異なるため，既に単一レバー比較が成立している**（B46 の副産物）．
            実測: top1 0.5556→0.5850（+2.94pt），kappa 0.5215→0.5541（+3.26pt），
            answer_quality 0.4933→0.5507（+5.74pt，3SD=2.6pt の 2.2 倍），
            mean_duration_ms 4558→4235（速くなる），McNemar p=1.59e-7．
            **fallback が発動した 212 問だけを見ると，general へ送ると 18/212（8.5%）しか
            正解しないが，argmax のドメインへ送れば 65/212（30.7%）正解する**．
            d0002 §8-3『fallback は Random(10.1%) を下回る』が定量的に裏付けられた．
            **実施方法**: config.yaml の confidence_threshold を 0.0 にする（または node.py の
            fallback 経路を明示的に無効化する）．**同時に dispatch_top_k を 2→1 へ戻すこと**
            （閾値を下げると dispatch 候補ゲートも緩むため．下記 aggregation_method の note 参照）．
            分散版で 1600 問を 1 回実行（約 90 分）．
            **論点**: 廃止は『確信が持てないときに汎用ノードへ退避する』という設計書の意図自体を
            捨てることになる．論文上どう位置付けるかは人間判断が要る（backlog B48 要レビュー）"}

