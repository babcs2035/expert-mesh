            特徴量エンジニアリングで強化）。
            (c) `education_posthoc_calibration`: 分類器の出力確率にeducation-specificなpost-hoc
            較正を適用（education classの確率にbiasを付与する）。argmax flip rateを低く抑えながら
            education_recallを改善可能。
            (d) `education_per_class_threshold`: 分類器の出力確率に対してeducation classのdecision
            thresholdをpost-hocで下げる。argmax計算前にeducation classの確率にthreshold分を加算
            （`prob_edu + threshold > prob_other`）。intercept shiftと同原理（decision boundaryの
            位置のみ変化）で、argmax flip rateは<15%と推定。classifier再訓練不要。
            **単一レバーの保証**: embedding空間は不変（base model freeze）。classifier training /
            evaluation のみで完結。runtime routing（http_server.py）は変更不要。
            **コスト**: 低（オフライン完結、~10-15分）。
            **成功条件**: education_recall > medical_recall基準(0.5112)、
            他9ドメイン18指標のBH補正後有意退行0件、argmax flip rate <15%、
            top1_accuracy McNemar p>=0.05
