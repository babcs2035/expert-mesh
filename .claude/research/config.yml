            **主基準の置き方（重要）**: 本レバーは **top1_accuracy を構造的に動かさない**
            （top1 は rank 1 のみに依存し gap 閾値と独立）．したがって主基準は
            `compound_domain_set_recall` に置き，**top1_accuracy は非退行条件（低下させないこと．
