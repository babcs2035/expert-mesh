  - {name: conformal_set_size_reduction, values: [randomized_aps, raps_penalty],
     note: "[2026-09-23 Iter72 reflector 新設 / backlog B108] Iter72 で split conformal の
            交換可能性が回復し coverage=0.940000（名目 0.90，帯 0.88-0.95 内）が得られた一方，
            mean_set_size=5.52（10 ドメイン中 5.5 個，set_size<=2 は 5.5% のみ）で，予測集合は
            dispatch 先の絞り込みには大きすぎる．複合設問は 2 ドメインなので top-2 dispatch へ
            流用するには set_size≈2 が要る．**被覆を帯に保ったまま集合サイズを縮めることが，
            conformal を研究の本線（ルーティング）へ接続できるかを決める唯一の残り変数である**．
            **randomized_aps（Iter73 の単一レバー）**: Romano et al. (2020) の APS は
            非適合スコアに一様乱数 U を混ぜ，打ち切り位置のクラスを確率 U で含める／含めないと
            決めることで被覆を名目へ厳密に一致させる．本実装は非ランダム化版であり，
            Iter72 の分析で**残る +4.0pt の過被覆がこの離散化に帰属すること**が
            （校正半 0.94875 と評価半 0.94000 の一致，および過被覆量の α 依存性から）特定済み．
            したがって U 項を入れれば coverage は名目 0.90 近傍へ下がり，その分 mean_set_size も
            縮むはずである．**変更は非適合スコアへの単一の U 項の追加のみ**で，分類器・埋め込み・
            argmax・confidence・`config.yaml` は一切変えない．
            **実装方針**: CLI に `--set-construction randomized_aps` を追加（既定
            `corrected_aps` を温存し後方互換 md5 を保つ）．校正側スコアは
            `S = 1 - cumsum + U * p_true`，評価側も同じ U 付き規則で打ち切る．
            U は `--randomization-seed`（既定 42）で固定し再現性を確保する．
            `--calibration-source eval_holdout --holdout-seed 42 --qhat-quantile-direction
            alpha_lower --qhat-source true_class --confidence-level 0.90` は Iter72 の値に固定．
            CLI の `--output` 有無 2 分岐**両方**への伝播は Iter69〜72 で 4 回警告された
            落とし穴なので必ずチェックリスト化すること．また Iter72 で `UnboundLocalError` を
            出した教訓から，**新分岐を足すときは既存分岐でのみ初期化される局所変数を洗い出す**こと．
            **成功条件（planner が事前登録で確定）**: 主基準は coverage が 0.88 <= coverage <= 0.95
            の帯に留まったまま mean_set_size が 5.52125 から有意に減少すること（減少幅の有意性は
            対応ありの 800 行で評価する）．非退行は Iter72 と同型（`selected_domain` 完全一致・
            `probabilities` 一致 1e-9・既定値での再実行が Iter72 出力と md5 一致・stderr 発火証拠）．
            **ノイズ幅**: n=800・p≈0.90 で二項 SE≈0.0106．分割由来のばらつきが SE と同程度乗る
            （Iter72 実測で 10 分割の coverage は 0.9375-0.9537）ため，seed は 42 に固定し
            結果が帯外でも振り直して合格を探さないこと．
            **raps_penalty（次点，randomized_aps の結果を見てから）**: Angelopoulos et al.
            (arXiv:2009.14193) の RAPS はスコアへサイズ正則化項（k_reg 番目以降のクラスに
            ペナルティ λ を加算）を足して集合を明示的に小さくする．**ハイパラが 2 個（k_reg, λ）
            あり単一レバーの粒度として粗い**ため，まず randomized_aps で無償に得られる縮小分を
            取り切り，それでも mean_set_size が実用域に届かない場合に残差へ当てる順序とする．
            着手する場合は k_reg をルーティングの要求（<=2）から先に固定し，λ の 1 次元だけを
            振ること．
            **不成立の場合**（randomized_aps でも mean_set_size が実質的に縮まない，または
            coverage が帯を割る）: 『本分類器の確率分布では，名目 0.90 の被覆を保ったまま
            ルーティングに使える大きさの予測集合は作れない』という結論になるため，raps_penalty
            へ進むか conformal 系列を閉じるかを人間に諮る（B104 A2 の実行時配線の可否と併せて）．
            **コスト**: オフライン完結・分類器再訓練なし・実機ノード不使用．1 実行 5〜10 分．
            [2026-09-23 Iter74 reflector追記] **全 2 値試行済み・本レバークローズ確定**．
            `randomized_aps`（Iter73）adopted（coverage=0.90375, mean_set_size 5.52125→4.00125），
            `raps_penalty`（Iter74，k_reg=2・λ=0.02）**rejected**（coverage=0.90750 は帯内だが
            mean_set_size が 4.00125→4.16375 と **+0.1625 有意に増加**．対応あり 800 行の
            `ttest_rel` t=-7.515, p=1.53e-13，減少 86・同数 507・増加 207）．
            実測は事前シミュレーションの予測（coverage 0.90750 / mss 4.16375 / q_hat 0.032331 /
            サイズ分布 [5,57,154,259,241,79,5]）と**最終桁まで一致**し，事前登録した解釈規則
            （予測の ±0.02 以内なら実装は正しく発火したうえで手法が効かない）により
            **実装不成立ではなく手法の無効**と判定した（非退行 6 項目も全充足．
            `probabilities` 最大差 0.0，`randomized_aps` 再実行が Iter73 出力と md5 一致
            `afde650eea9ac611a43f0bb20703c2e3`）．
            **機序**: RAPS のペナルティは校正側の真クラススコアと評価側の各クラススコアの
            両方へ同形に入るため，λ を上げると q_hat がほぼ同量下がって相殺する．残るのは
            サイズ分布の圧縮（size 1 が 52→5 行，size 4〜5 に 360→500 行が集中）であって
            平均の縮小ではない．RAPS が原論文（ImageNet 1,000 クラス）で平均を下げたのは
            APS の重い裾を切ったからであり，10 クラス・最大サイズ 8 の本問題には切る裾が無い．
            **構成法による size≈2 は到達不能（確定）**: サイズ最適性が証明されている LAC/THR
            （Sadinle et al., JASA 2019）でも名目 0.90 では mean_set_size=3.825 が床であり，
            size≈2 には被覆水準 0.80 前後（LAC で 2.24，ただし複合設問の 2 ドメイン同時被覆は
            0.26→0.065 へ崩壊）まで落とすほかない．**予測集合を top-2 dispatch へ流用する構想の
            障害は conformal の構成法ではなく分類器の確率分布の鋭さ（top1≈0.60）にある**．
            実装（`--set-construction raps_penalty` / `--raps-lambda` / `--raps-k-reg`）は
            **revert せず維持**する（既定 `broken`/`corrected_aps` が後方互換 md5 を保つ）．
            次レバーは下記 `conformal_runtime_distribution_alignment`．"}

