            N5（単一ドメイン 1500 行の argmax 正解率）が有意に退行し，誤りが『合成ペアで共起させた
            相手ドメイン』へ集中した．**しかし Iter64→65 は『合成文の本数 405→810』と
            『質量比 35.1%→51.9%』を同時に動かしており，この 2 つは分離されていない．**
            810 行の多様性は保ったまま質量比だけを Iter64 水準へ戻せば，
            機序 (2)（境界の融解）が質量比に由来するのか本数に由来するのかを判定できる．
            **単一レバー**: 多ラベルヘッドの訓練に渡す**単一ドメイン訓練行を 2 重化する**
            （`data/classifier_train.jsonl` 1427 行 → 各行を 2 回含む 2854 行を
            `data/classifier_train_iter66_x2.jsonl` として新規出力し，
            `train_multilabel_dispatch_head.py --train-data` にこれを渡す）．
            合成側は **Iter65 の `data/classifier_train_multidomain_iter65.jsonl`（810 行）を
            そのまま再利用し，再生成しない**（生成乱数の実現値を固定＝Iter65 との差分が
            混合比のみになる）．これにより非 legal ドメインの陽性行は 150×2+162=462 行，
            合成比率は 162/462=**35.1%**＝Iter64 と同一水準に戻る．
            **`sample_weight` を使わない理由**: Iter32 で `LogisticRegression(class_weight='balanced')`
            が `sample_weight` と乗算され意図した重み付けが減衰する結合が実測済みであるため，
            行の複製という透明な手段を採る（重み 2.0 と数学的に等価だが，sklearn の内部結合に
            依存しない）．**コード変更は不要**（複製ファイルの生成は 5 行程度の一時スクリプト）．
            **固定する構成**: 合成訓練データ（Iter65 の 810 行）・生成系一式・埋め込み
            `nomic-embed-text` とキャッシュ・ヘッド種別（`train_multilabel_dispatch_head.py` の
            現行実装＝OvR×Platt 較正．**未較正ではない．上記の訂正を参照**）・採点／統計スクリプト・
            `--rank1-source head_argmax`・基準線 `results/20260918_202613/results.jsonl`・
            `config.yaml`・実行時経路（配線しない）．
            **成功条件（暫定案．計画フェーズで事前登録して確定すること）**:
            (a) **N5 ≧ 0.590**（本レバーの主基準．質量比仮説が正しければ Iter64 水準 0.5913 へ
            回復するはず．回復しなければ N5 の退行は質量比ではなく『合成文そのものの分布シフト』に
            由来すると確定する）．(b) N2' ≧ 0.5875．(c) 被覆 2 個行 **>21**（Iter65 実測）．
            (d) S3 mean_dispatch=2.000000・S4 対 Iter65 予測の不一致行 >0．
            **探索的（主基準にしないこと）**: 被覆 2 個行が Iter64 の 24 を上回るか（上回れば
            『本数は効くが質量比が打ち消していた』という強い証拠になり，用量反応の再開が正当化される）．
            **既知の留保（計画フェーズで必ず事前登録すること）**: 行の複製により
            `CalibratedClassifierCV(cv=5)` の較正 fold 分割で同一行が訓練側と検証側に跨りうる
            （較正パラメータが楽観化する方向）．**この留保は本レバーの構造的制約であり，
            N5 の解釈（単一ドメイン argmax の正解率）には argmax の順序しか効かないため
            影響は限定的だが，較正値そのものを対外引用しないこと．**
            **コスト**: 合成生成は不要（既存 810 行を再利用）．ヘッド再訓練（2854+810 行の埋め込み，
            Iter65 実測 276 秒の約 1.6 倍＝10 分程度）＋採点 1 分＋統計・集計 1 分＝**15 分程度**．
            オフライン完結・`config.yaml` のスキーマ変更なし・実機 1600 問本走なしのため自律着手してよい．
            **不成立の場合**（N5 が 0.590 へ回復しない）: 『合成文は質量比に関わらず単一ドメイン
            判別を壊す』ことになり，次は (i) 合成行を単一ドメイン分類の学習から切り離す構造
            （rank_1 は既存の単一ドメイン分類器，rank_2 のみ合成データで学習した別ヘッド＝
            2 ヘッド構成）へ移る．(ii) それも不可なら生成文の品質改善（echo 除去）・
            複合設問データセットの再設計（research_frontier 相当・人間判断）．"}

