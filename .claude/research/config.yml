            他9ドメイン18指標のBH補正後有意退行0件、top1_accuracyのMcNemar有意改善
            [2026-08-02 Iter40 reflector追記] `setfit_education_finetune` はrejected確定。
            全パラメータfine-tuningは単一レバー原則と両立しない（argmax flip rate 52.56%）。
            次値 `embedding_adapter_only_lora`（LoRA r=16）はrejected確定（argmax flip rate
            35.88%）。Iter40→41のトレンド（52.56%→35.88%）から、rankを半減のr=8で単一レバー
            到達可能性を検証。r=8もrejectedの場合、LoRAアプローチは構造的限界の可能性が高い。
            [2026-08-02 Iter41 reflector追記] LoRA r=16→r=8の段階的削減を検証。
            単一レバー<15%到達がr=8でも不可能な場合、embedding出力への線形射影（projection head）
            や、LoRA以外の根本的に異なるアプローチへ移行する。
            [2026-08-02 Iter42 reflector追記] LoRA r=8はrejected確定（argmax flip rate
