            の下で `compound_mean_dispatched_count` が 1.880→1.610 へ減り
            `compound_domain_set_recall` が 0.548193→0.539759（-0.84pt）と微減した．
            **これは埋め込みの劣化ではない**: `probe_candidates` から gap 閾値を掃引すると，
            送出予算を基準線と同じ mean_k=1.880 に揃えた時点（**gt=0.357，mean_k=1.889**）で
