            到達しないのではなく，到達しても測定系の分解能が足りない．
            **打ち止め条件の発動**: 上記 (1)(3) は note 末尾の「不成立の場合」に相当する．
            **rank_2 ヘッドの学習データ側（混ぜ方・量・構造・質）を動かす同系列のレバー探索は
            Iter63〜68 をもって打ち止めとする**．次に諮るべきは (i) 複合設問データセットの拡充
