            招いたと読む．**M5 の構造的解釈（共有 softmax 正規化が零和性の原因）は支持されなかった**
            （正側 +3.04pt 対 負側 −10.72pt で零和ではなく正味の損失．腕 A recall と Δ の
            Spearman は +0.018, p=0.96 で Iter96 の −0.717 が消えた）．
            **次は第 2 値 `error_correcting_output_codes` を，決定層の軸を閉じるための確認実験として
            引く**（B163）．符号長は掃引せず計画フェーズで単一値を事前登録すること．
            ここも通らなければ決定層の軸は打ち止めとし，入力表現／ラベルの軸へ移る．
            **【2026-09-28 Iter98 調査・計画フェーズ・backlog B164】value
            `error_correcting_output_codes` の事前登録値（掃引禁止）**:
            符号は **dense random code，長さ L = 34 = ⌈10·log₂(10)⌉**（Allwein, Schapire & Singer
            (2000) JMLR 1:113-141 の既定．候補 10,000 本から行間最小 Hamming 距離が最大のものを選ぶ．
            実測で最小距離 14・重複列 0），**復号は log 損失の loss-based decoding（＝最尤復号）**，
            `random_state = 98`．**実装上の必須注意（2026-09-28 に実測で確認済み．sklearn 1.9.0）**:
            `sklearn.multiclass.OutputCodeClassifier` は **`predict` しか持たず**
            （`predict_proba`・`decision_function` が無い），`CalibratedClassifierCV` に渡すと
            `InvalidParameterError` で fit できない．したがって Iter97 のような base estimator の
            差し替えだけでは実装できず，`decision_function` を返す薄いラッパ
            `EcocLogLossClassifier`（リポジトリ直下の新モジュール `ecoc_head.py`．joblib が
            モジュールパス参照で直列化するため `scripts/` 内や `__main__` で定義してはならない．
            `Dockerfile` の COPY 行への追加が要る）を自前で書く．`fit(self, X, y, sample_weight=None)`
            と明示引数を持たせれば **`enable_metadata_routing` なしで警告 0 件で重みが届く**
            （等重みとの `max|Δcoef| = 0.0935` で到達を実証済み）．`predict_proba` の行和は 1.0，
            復号スコアは連続量で Iter97 の P4（得票の離散性による gap 収縮）は起こらない．
            **【2026-09-28 Iter98 分析フェーズ・backlog B165】value
            `error_correcting_output_codes` は `closed`（本走なし）かつ**反証済み（再試行しない）**．
            実測（`results/iter98_screening/screening_result.json`，3 seed × 固定 5-fold，n=6,825）:
            腕 A 0.802637 / 腕 C（ECOC, L=34, 最尤復号）0.788425，**Δ = −1.421pt**（足切り ① に
            符号ごと不通過），全体 McNemar 併合 p=2.81e-9・保守 p=0.00060，BH 後の有意退行
            併合 3 件（education −7.00pt，social_science −6.40pt，general −2.67pt）で足切り ② も不通過．
            P3・P4・P5 は当選（行和 1.0，gap<0.36 割合 Δ=+0.40pt，ECE 0.01650≤0.01971，
            34 列の二値 CV 正解率 中央値 0.893）で，**実装・較正・部分問題の学習はいずれも健全**である．
            **機序 M6（Iter97 の M5 系統の読みを差し替え）**: 誤りは決定則ではなく**入力表現（行）**の
            性質である．(1) 列誤りが独立なら Monte Carlo で top1=0.9997 のはずが実測 0.788，
            (2) 恒等式『列誤り率 ≒ 行誤り率 × 平均行間 Hamming 距離 / L』が 0.1081 vs 実測 0.1097 で
            成立＝ビット誤りは誤答行に全量集中し符号語ごと置換されている（訂正能力 6 ビットは名目値），
            (3) 腕 A と腕 C の誤答行の重なりは 87.6% / 93.9%（Rifkin & Klautau 2004 の AGREE の再現）．
            したがって符号長・復号方式を変えた再試行に見込みは無く，**`classifier_multiclass_decomposition`
            レバー全体を closed とし，決定層の軸は打ち止め**にする．次は入力表現の軸
            （`embedding_model_replacement` の新値）へ移る．"}

