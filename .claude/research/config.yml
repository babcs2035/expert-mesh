            **内容（単一レバー）**: `config.yaml:90` の `dispatch_gap_threshold` の値のみを，
            連結埋め込みの確信度分布に合わせて再較正する．`dispatch_policy`
            （=adaptive_confidence_gap，Iter58 で adopted）・`dispatch_top_k=2`・
            `dispatch_gap_max_k=4`・埋め込み・分類器・訓練データ・評価集合は一切変えない．
