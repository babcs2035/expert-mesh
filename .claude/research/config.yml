# 2026-07-26 改訂（p0001 F1）．旧基準は Iter1 専用の記述が残っていたうえ，n=46 では
# top1_accuracy の 1 問差（±2.2pt）すら分離できないため，判定基準として機能していなかった．
# 【2026-07-27 追記】E1（200問以上への拡張）は実質完了した（1520問のJMMLUデータセット，
# results/20260727_010532/で実験実行済み．journal.md「実験 (Iter15)」節参照）．よって下記の
# 「E1完了後」の基準は，次のrc-analystが分析を行う時点で**そのまま適用可能な現行基準**である．
success_criteria: "【2026-07-31 改訂】E1（評価集合の拡張）は Iter15/25 で完了し，現在 1600 問．
  以下を現行基準として適用する．
  (1) 主基準は top1_accuracy の McNemar 対比較（同一問題集合，α=0.05）で有意差があること．
      効果量は Wilson 95% CI を必ず併記し，CI が重なる変化は『判定不能』として棄却も採用もしない．
  (2) 非退行は per-domain precision/recall の CI 下限が現行ベースラインの CI 下限を下回らないこと．
  (3) 参照点として Random / BestSingle（常に general へ送る）/ Oracle（正解ドメインへ送る）を
      毎回同時に報告し，提案手法が BestSingle を上回っているかを明示する
      （LLMRouterBench は，複数の最近手法が単純ベースラインを安定して上回れないと報告している）．
  (4) confidence 信号系のレバーでは accuracy に加えて ECE・AUROC・同点率・ノード間 confidence 分散を報告する．
  (5) 【新設・d0003 X6 の完了に伴う】軸②③（answer_quality_accuracy・end_to_end_accuracy）の変化は，
      **3SD = 2.6pt を超えない限り有意と判定してはならない**．根拠は Iter25 基準線と Iter27 の 3 実行
      （ルーティングが決定論的に同一で，生成のランダム性のみが異なる 4 反復）の実測で，
      値は 0.5087 / 0.4960 / 0.4913 / 0.5080，標準偏差 0.87pt，行単位では 23.9%（359/1500）が
      反復間で正誤反転した．**従来使っていた暫定値 1.3pt（n=2，d0002 §6-F）はこれで置き換える．**
      軸①（ルーティング系）は決定論的なのでこのノイズ床は適用しない（差が出れば必ず何かが変わっている）．
  (6) 【新設】主要指標が基準線と小数点以下まで完全一致し，かつ McNemar の不一致ペアが 0 件の場合，
      『効果なし（rejected）』ではなく **『実験不成立（invalid）』** と判定し，レバーが読まれる
      コードパスに到達していたかを先に検証すること（d0004 §4）．
  (7) 【新設 2026-10-04・Iter107・B201】報告用の確信度だけを変え，決定を変えないレバー（例: dispatched_set_confidence）に適用する．
      (1) の McNemar を主基準とする規定と (6) の『不一致 0 件なら invalid』は，このレバーには適用しない．
      主基準: 本走の共通行（dispatch_failed を除く）の複合行で，ECE の新しい定義（送出集合の確率の和，正誤は送出集合と正解の交わり）が旧の定義（rank 1 の確率，正誤は selected ∈ expected）より 0.02 以上小さく，
      行を対にした bootstrap（2000 回）の『新 − 旧』の 95% 信頼区間の上限が 0 未満であること．replay の予測は −0.040，replay と本走の揺らぎの床は新しい定義で ±0.6pt と見積もる．
      非退行: 共通行の全体で新 ≤ 旧，単一行で新 ≤ 旧 + 0.005．旧の定義の ECE（共通行）は基準線の 0.0373 から +0.006 以内．
      決定の不変: top1 の基準線との差が ±0.1pt 以内で，McNemar が有意でないこと．本走は埋め込みを Ollama で取り直すので，selected の不一致は 0 件にならず，16 行程度は出る（B200）．
      C7 と ECE の判定帯は，新旧の両方の値を毎回併記し，どちらの定義を指すかを明記する．AUROC と Brier も新旧を併記する．
      OOF は単一ラベルだけなので，複合行の選択には使えない．単一行の非退行の確認にだけ使う．
  (8) 【新設 2026-10-05・Iter108・B204】訓練集合の行を除くレバー（confident_learning_train_row_pruning）に適用する．
      Step 0（CPU だけの入れ子 CV．eval は使わない）: CV top1 が none を +1.0pt 以上上回り，かつ 5 fold のうち 4 fold 以上で上回ること．満たさなければ artifact を変えずにクローズし，本走は行わない（artifact を変えていないので，絶対条件 (A) の『変更を適用したら本実験』には当たらない．Iter93 と同じ扱い）．
      replay: 同じ eval キャッシュ上の『変種 − none』の対応のある比較を併記する．ノイズの床は B200（selected 16 行，top1 正味 ±2 行）とし，僅差の 49 行と kNN の 2 位・3 位の接近行を除いた部分集合でも確かめる．
      主基準（本走）: 基準線 results/20261004_225553 に対し，共通行（dispatch_failed を除く）で Δtop1 ≥ +0.5pt（約 19 行）かつ McNemar 両側 p < 0.05．
      非退行: Iter107 の C1〜C7（C1 は 20 指標，BH q=0.05 で有意な退行 0 件）．japanese_civics，sociology，high_school_psychology，moral_disputes の recall の差を併記する．
      ECE は新旧の定義を併記し，判定は旧の定義で行う（B203 の A1-1．回答があるまでの扱い）．決定を変えるレバーなので本走を行う．"

