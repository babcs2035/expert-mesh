            **コスト**: オフライン完結・実機ノード不使用・埋め込み再計算なし・実行数分．
            **不成立の場合**: 『棄権信号は実行時 confidence（temperature 較正済み MSP）で
            足りる』が本リポジトリで確定し，選択的ルーティング系列も閉じる．その場合の次は
            複合設問データセットの拡充（research_frontier 相当・人間判断）となる．"}

