            `run_experiment.py` または `scripts/evaluate_response_quality.py` に言語判定ステップを追加する
            経路になる．いずれも実装前に到達確認を行うこと（d0004 §4 の教訓）．
            **設定ファイルへの影響**: system_prompt_enforcement はプロンプト文言変更のみで
            `config.yaml` のスキーマ変更は不要と推定される．post_hoc_langdetect_retry を config 化する
            場合は新規フィールドの追加を要する（着手前に確認）"}

  # --- 【次点・低コスト】confidence calibration の新しい軸: conformal prediction による被覆保証 ---
  - {name: routing_confidence_calibration_method, values: [conformal_prediction],
     note: "[2026-08-08 docs/d0007 §5-b] `classifier_calibration`（platt/isotonic/temperature，
            Iter29〜31 で全値試行済み，temperature adopted）とは異なる統計的性質を持つ較正手法．
            temperature 較正は ECE（期待較正誤差）を最小化する点較正であるのに対し，conformal
            prediction は『指定した信頼水準でカバレッジを保証する』という被覆保証を提供する
            （CP-Router, Conformal Arbitrage, NeurIPS 2025）．
            **実施方法**: 既存の分類器 confidence 値（`models/domain_classifier.joblib` の
            `predict_proba` 出力）に対し，held-out キャリブレーションセットで non-conformity score
            を計算し，予測集合（prediction set）を構成する．**分類器の再訓練は不要**，既存 confidence
            値の再利用でオフライン完結する．
            **単一レバー原則との相性**: 良い．argmax（1 位選択）自体は変えず，予測集合のサイズや
            fallback 判定にのみ影響する後付けの統計的処理として実装できる．
            **成功条件（暫定）**: 指定信頼水準（例: 90%）に対する実際のカバレッジ率が有意に外れず，
            かつ ECE または fallback_rate が temperature 較正単体より改善すること．
            **到達コードパス**: `scripts/evaluate_classifier_calibration.py` に conformal prediction の
            予測集合構成ロジックを追加する経路が想定される．具体的な変更箇所は計画フェーズで確定する"}

  # --- 【3番目・要ユーザー確認】複合ドメイン compound_domain_set_recall の改善 ---
  - {name: dispatch_policy, values: [adaptive_confidence_gap],
     note: "[2026-08-08 docs/d0007 §3] `aggregation_method` レバー（Iter48 でクローズ．
            max_confidence adopted，compound_domain_set_recall=0.345，理論上限1.0）の後継．
            **機序**: 各ノードが 10 クラス softmax の自分のクラスの確率のみ返すため，2 位ノードの
            confidence は構造的に 0.5 弱を超えない（aggregation_method note 参照）．binary relevance
            （各ノードを独立の sigmoid にする）による根本解決は分類器の再訓練を要し単一レバー原則と
            相性が悪い．
            **adaptive_confidence_gap**: MoE 分野の adaptive gating（Huang et al., EMNLP 2023）・
            Expert Choice Routing（Google Research）に基づき，固定 `dispatch_top_k=2` を，1位・2位の
            confidence 差（gap）が閾値 `T` 未満のときだけ動的に k を増やす方式に変更する．既存の
            分類器出力はそのまま使い，`aggregator.select_dispatch_targets()` の dispatch 判定ロジック
            のみを変更するため分類器の再訓練は不要．argmax（1 位選択）自体は変えないため単一レバー
            原則の判定基準にそのまま適合する．
            **【重要】着手前にユーザー確認が必要**: `dispatch_top_k` を固定値運用から動的ポリシーへ
            変更するため，`config.yaml` のスキーマ変更を伴う可能性が高い．Y2（`dispatch_candidate_threshold`
            新設）と同様の扱いとし，CLAUDE.md の規約（public API・設定ファイル形式の変更は事前確認）
            に従うこと．
            **成功条件（暫定）**: compound_domain_set_recall が 0.345 から有意に改善し，単一ドメイン
            top1_accuracy が非退行であること"}

