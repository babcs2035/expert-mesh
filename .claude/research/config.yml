            記録（歴史的経緯として保持，実行しない）．
            [2026-09-23 Iter76 考察フェーズ / backlog B114．停止条件 1（学びからの新レバー考案）]
            **前提**: Iter76 で `routing_abstention_signal=conformal_set_size` は rejected
            （eval 半 n=800 の AUGRC 0.153391 対 max_probability 0.138450，ΔAUGRC=+0.014941，
            95%CI [0.007923, 0.022549]＝有意に劣る）．手組みの margin（+0.004042，有意に劣る）・
