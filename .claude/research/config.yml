            悪くなる側: MoDEM (arXiv:2410.07490) は 5 クラスで総合 81.00%，うち **Other(=general 相当)
            が 52.94%** と突出して低く原因を domain ambiguity と分析．**これは Iter4 で education 追加時に
            precision が 0.967→0.900 に落ちた現象と構造が同じ**で，general ノードが共通のボトルネック．
            Label Space Reduction (arXiv:2502.08436) もラベル数増加自体が LLM 分類精度を落とすと示す．
            **必須: 分野数が変わると偶然一致率が変わるため，生の accuracy を 4 分野と 10 分野で直接
            比較してはならない．κ 等の chance-corrected 指標を主指標に据えること．これを怠ると
            Iter13 と同種の解釈事故（偶然一致を下回る値を手法の失敗と誤読）を繰り返す．**
            前提: VRAM 制約上 10 ノード化とモデル 4B 化は分離できないため，先に expert_model_size を
            単独で実施してから着手すること"}
