            空間の回転が必要だが、これは必然的に他ドメインも移動させる）により、embeddingレベルの
            適応は単一レバー原則(<15% argmax flip)に到達不可能。
            **classifier-level適応のアプローチ**:
            (a) `education_feature_augmentation`: 既存embedding特徴量にeducation-awareな変数を追加
            （例: educationドメインのtraining dataとのcosine similarity、education classのmean
