# GPU pass-through override for hosts with an NVIDIA GPU and the
# nvidia-container-toolkit installed. `mise run deploy` applies this file
# automatically (via COMPOSE_FILE in .env) only on hosts where it detects
# an NVIDIA GPU; `docker compose up` fails immediately on GPU-less hosts if
# this override is applied there, since no nvidia runtime would be found.
# Only the ollama service needs GPU access — the app service only calls
# ollama's HTTP API and never touches the model runtime directly.
#
# Uses the legacy `runtime: nvidia` mechanism (not the
# deploy.resources.reservations.devices / CDI-based mechanism) because the
# physical cluster (wafl500-509) has an inconsistent nvidia-container-toolkit
# install: some hosts lack the `nvidia-ctk` CLI that CDI-based GPU discovery
# requires, which makes `docker compose up` fail with "failed to discover GPU
# vendor from CDI: no known GPU vendor found" on those hosts even though the
# "nvidia" OCI runtime itself is registered identically (in
# /etc/docker/daemon.json) on every host.
services:
  ollama:
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    # E10 domain_lora: mount LoRA adapter weights so Ollama can apply them
    # via the ADAPTER directive in Modelfiles. The models/lora_adapters/
    # directory is created by scripts/train_domain_lora.py and contains
    # per-domain safetensors files. Mounted read-only since adapters are
    # not modified at inference time. Path matches docker-compose.yml mount.
    volumes:
      - ./models/lora_adapters:/app/models/lora_adapters:ro
