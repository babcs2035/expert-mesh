# Definition of two services (ollama, app) started per node.
# NODE_ID is set in each host's .env file (generated by the deploy task).
services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
      # E10: LoRA adapter weights for domain-specific expert models.
      # Mounted so Ollama can access adapter files via ADAPTER directive
      # in Modelfiles (scripts/create_lora_model.py). Path matches the
      # adapter output directory from scripts/train_domain_lora.py.
      - ./models/lora_adapters:/app/models/lora_adapters:ro
    # Communicates with app over docker compose's internal network
    # (http://app:11434), so no need to expose to LAN. Binds to 127.0.0.1
    # only to avoid exposing an unauthenticated API externally, while still
    # allowing connectivity checks from the host for debugging.
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      # Ollama's default keep_alive (5m) unloads idle models from VRAM/RAM,
      # which defeats the lab's requirement to keep model weights resident
      # across experiments. -1 disables the idle unload entirely.
      - OLLAMA_KEEP_ALIVE=-1
      # Iter100 (embedding_space_fusion): Ollama's default max loaded models
      # is 3 per GPU (docs.ollama.com/faq), and the entry node already loads
      # exactly 3 (light_model + expert_model + embedding_model). Adding
      # embedding_fusion_models' ruri-v3-310m makes a 4th; without raising
      # this, Ollama silently queues the 4th model's requests instead of
      # erroring (journal.md "Iteration 100" Q3), which would show up only as
      # a latency regression. Pre-Iter100 configs (embedding_fusion_models
      # unset/empty) still request only 3 models, so this is a no-op for them.
      - OLLAMA_MAX_LOADED_MODELS=4
    restart: unless-stopped

  app:
    # Port 5000 is already used by another project (WAFL-PEFT) in this lab.
    image: localhost:5001/expert-mesh:latest
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
      # Used by tools/healthcheck.py etc. to identify "self" (hairpin NAT workaround)
      - NODE_ID=${NODE_ID}
    command: ["serve", "--node-id", "${NODE_ID}"]
    # Other nodes send /probe and /dispatch via the real IP from config.yaml,
    # so the port must be exposed on the LAN interface (intentionally bound
    # to all interfaces on this host for this port only).
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./results:/app/results
      # E6 supervised_classifier artifact (scripts/train_domain_classifier.py's
      # output), mounted read-only so retraining doesn't require an image rebuild.
      - ./models:/app/models:ro
    restart: unless-stopped

volumes:
  ollama_data:
